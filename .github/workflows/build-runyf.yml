name: Build and Push (runyf)

on:
  push:
    branches: [ v0.29.0-runyf ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  binary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -o headscale ./cmd/headscale

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: headscale-${{ matrix.goos }}-${{ matrix.goarch }}
          path: headscale

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: runyf/headscale
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v0.29-runyf
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: headscale-*
          merge-multiple: true
          path: artifacts

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" > /tmp/notes.md
            echo '```' >> /tmp/notes.md
            git log --oneline $PREV_TAG..HEAD >> /tmp/notes.md
            echo '```' >> /tmp/notes.md
          else
            echo "## Commits" > /tmp/notes.md
            echo '```' >> /tmp/notes.md
            git log --oneline --max-count=20 >> /tmp/notes.md
            echo '```' >> /tmp/notes.md
          fi
          echo "" >> /tmp/notes.md
          echo "### Docker" >> /tmp/notes.md
          echo "\`docker pull runyf/headscale:${GITHUB_REF_NAME}\`" >> /tmp/notes.md

      - name: Package and rename
        run: |
          cd artifacts
          mkdir -p ../release
          for f in headscale-linux-*; do
            arch=$(echo $f | sed 's/headscale-linux-//')
            cp $f/headscale ../release/headscale-linux-${arch}
          done
          ls -la ../release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          files: release/*
          draft: false
          prerelease: false
